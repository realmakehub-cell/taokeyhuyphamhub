<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huy Pham Hub - Nhập key</title>
<style>
:root{
  --ink:#0a0b0d;--panel:#111317;--raise:#171a1f;--line:#2a2f37;--line-hi:#4a525e;
  --text:#f2f4f7;--muted:#98a1ad;--ok:#7ee2a3;--bad:#ff7a7a;--warn:#f0c674;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--ink);color:var(--text);font:15px/1.5 var(--sans)}
.wrap{width:min(100%,520px)}
.brand{margin:0 0 18px 4px;font-size:14px;font-weight:700;letter-spacing:.14em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
h1{margin:0 0 4px;font-size:22px;font-weight:650;line-height:1.25}
.sub{margin:0 0 22px;color:var(--muted);font-size:13.5px}
label{display:block;margin:0 0 8px;font-size:13px;color:var(--muted)}
.field{display:flex;gap:8px}
input{flex:1;min-width:0;padding:15px 14px;border-radius:10px;border:1px solid var(--line-hi);background:var(--ink);color:var(--text);font:600 16px var(--mono);letter-spacing:.04em;text-transform:uppercase}
input::placeholder{color:#59616d;text-transform:none;letter-spacing:0;font-weight:400}
button{min-height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line-hi);background:var(--raise);color:var(--text);font:600 14px var(--sans);cursor:pointer}
button:hover{border-color:#6b7482}
button:disabled{opacity:.55;cursor:default}
.primary{width:100%;margin-top:14px;background:var(--text);color:var(--ink);border-color:var(--text)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#status{display:flex;align-items:center;gap:8px;min-height:22px;margin-top:14px;font-size:13.5px;color:var(--muted)}
#status i{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
#status.ok{color:var(--ok)}
#status.bad{color:var(--bad)}
.result{margin-top:22px;padding-top:22px;border-top:1px solid var(--line)}
.count{font:600 clamp(34px,10vw,48px)/1.1 var(--mono);font-variant-numeric:tabular-nums;letter-spacing:.02em}
