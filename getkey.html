<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huy Pham Hub - Lấy key</title>
<style>
:root{
  --ink:#0a0b0d;--panel:#111317;--raise:#171a1f;--line:#2a2f37;--line-hi:#4a525e;
  --text:#f2f4f7;--muted:#98a1ad;--ok:#7ee2a3;--bad:#ff7a7a;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--ink);color:var(--text);font:15px/1.5 var(--sans)}
.wrap{width:min(100%,520px)}
.brand{margin:0 0 18px 4px;font-size:14px;font-weight:700;letter-spacing:.14em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
h1{margin:0 0 4px;font-size:22px;font-weight:650;line-height:1.25}
.sub{margin:0 0 20px;color:var(--muted);font-size:13.5px}
ol{margin:0 0 20px;padding-left:20px;color:var(--text)}
li{margin:0 0 8px;padding-left:4px}
li::marker{color:var(--muted)}
button,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line-hi);background:var(--raise);color:var(--text);font:600 14px var(--sans);cursor:pointer;text-decoration:none}
button:hover,.btn:hover{border-color:#6b7482}
button:disabled{opacity:.55;cursor:default}
.primary{width:100%;background:var(--text);color:var(--ink);border-color:var(--text)}
:focus-visible{outline:2px solid var(--text);outline-offset:2px}
#status{display:flex;align-items:center;gap:8px;min-height:22px;margin-top:14px;font-size:13.5px;color:var(--muted)}
#status i{flex:none;width:8px;height:8px;border-radius:50%;background:currentColor}
#status.ok{color:var(--ok)}
#status.bad{color:var(--bad)}
.keybox{margin:0;padding:16px 14px;border-radius:10px;border:1px solid var(--line-hi);background:var(--ink);font:600 clamp(15px,4.4vw,19px)/1.3 var(--mono);letter-spacing:.04em;overflow-wrap:anywhere;user-select:all}
.actions{display:flex;gap:8px;margin-top:14px}
.actions>*{flex:1}
