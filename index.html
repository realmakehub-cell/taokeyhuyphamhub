<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>huyphamdeptrailongleuleuoccut - Get Key Access</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Rajdhani', sans-serif;
        }

        body {
            background-color: #05070a;
            color: #e2e8f0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        /* Nền lưới 3D Cyberpunk */
        .bg-grid {
            position: absolute;
            width: 200%;
            height: 200%;
            background-image: 
                linear-gradient(to right, rgba(0, 242, 254, 0.05) 1px, transparent 1px),
                linear-gradient(to bottom, rgba(0, 242, 254, 0.05) 1px, transparent 1px);
            background-size: 40px 40px;
            transform: perspective(500px) rotateX(60deg) translateY(-100px);
            animation: gridMove 20s linear infinite;
            z-index: 1;
        }

        @keyframes gridMove {
            0% { transform: perspective(500px) rotateX(60deg) translateY(0); }
            100% { transform: perspective(500px) rotateX(60deg) translateY(40px); }
        }

        /* Quầng sáng Neon tỏa phía sau */
        .orb-1, .orb-2 {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(90px);
            opacity: 0.35;
            z-index: 1;
        }
        .orb-1 { background: #00f2fe; top: 15%; left: 20%; }
        .orb-2 { background: #9d4edd; bottom: 15%; right: 20%; }

        /* Khung hiển thị Glassmorphism */
        .card-container {
            position: relative;
            z-index: 10;
            background: rgba(13, 17, 23, 0.75);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(0, 242, 254, 0.3);
            border-radius: 20px;
            padding: 40px 30px;
            max-width: 480px;
            width: 90%;
            text-align: center;
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.15),
                        inset 0 0 15px rgba(0, 242, 254, 0.05);
        }

        /* Biểu tượng Đầu Lâu Neon (Animation) */
        .skull-wrapper {
            position: relative;
            width: 120px;
            height: 120px;
            margin: 0 auto 20px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .skull-glow {
            position: absolute;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle, rgba(0, 242, 254, 0.4) 0%, transparent 70%);
            border-radius: 50%;
            animation: pulse 2.5s infinite ease-in-out;
        }

        .skull-svg {
            width: 90px;
            height: 90px;
            fill: none;
            stroke: #00f2fe;
            stroke-width: 1.8;
            filter: drop-shadow(0 0 12px #00f2fe);
            animation: float 3s infinite ease-in-out;
        }

        @keyframes pulse {
            0%, 100% { transform: scale(0.9); opacity: 0.4; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }

        /* Tiêu đề */
        h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 32px;
            font-weight: 900;
            letter-spacing: 3px;
            background: linear-gradient(135deg, #ffffff 0%, #00f2fe 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            margin-bottom: 5px;
            text-shadow: 0 0 20px rgba(0, 242, 254, 0.3);
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            margin-bottom: 25px;
            font-weight: 600;
        }

        /* Khung chứa Key */
        .key-container {
            background: rgba(5, 7, 10, 0.8);
            border: 1px solid rgba(0, 242, 254, 0.4);
            border-radius: 12px;
            padding: 16px;
            margin-bottom: 25px;
            position: relative;
            overflow: hidden;
            box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
        }

        .key-container::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(0, 242, 254, 0.15), transparent);
            transition: 0.5s;
            animation: shine 3s infinite;
        }

        @keyframes shine {
            0% { left: -100%; }
            20% { left: 100%; }
            100% { left: 100%; }
        }

        .key-text {
            font-family: 'Orbitron', monospace;
            font-size: 15px;
            font-weight: 700;
            color: #00f2fe;
            word-break: break-all;
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
        }

        /* Nút Sao Chép */
        .btn {
            font-family: 'Orbitron', sans-serif;
            font-size: 15px;
            font-weight: 700;
            padding: 14px 20px;
            width: 100%;
            border-radius: 10px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, #00f2fe 0%, #4facfe 100%);
            color: #05070a;
            border: none;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.4);
        }

        .btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 0 30px rgba(0, 242, 254, 0.7);
        }

        .footer-text {
            margin-top: 25px;
            font-size: 12px;
            color: #64748b;
            letter-spacing: 1px;
        }

        /* Thông báo Toast */
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: #00f2fe;
            color: #05070a;
            padding: 12px 24px;
            border-radius: 30px;
            font-weight: 700;
            font-family: 'Orbitron', sans-serif;
            font-size: 13px;
            box-shadow: 0 0 20px rgba(0, 242, 254, 0.6);
            transition: bottom 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            z-index: 100;
        }

        .toast.show {
            bottom: 30px;
        }
    </style>
</head>
<body>

    <div class="bg-grid"></div>
    <div class="orb-1"></div>
    <div class="orb-2"></div>

    <div class="card-container">
        <!-- Biểu tượng Đầu Lâu Phát Sáng -->
        <div class="skull-wrapper">
            <div class="skull-glow"></div>
            <svg class="skull-svg" viewBox="0 0 24 24">
                <path d="M12 2C7.58 2 4 5.58 4 10c0 2.5 1.14 4.73 2.94 6.21C7.29 16.5 8 17.5 8 18.5V20c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-1.5c0-1 .71-2 1.06-2.29C18.86 14.73 20 12.5 20 10c0-4.42-3.58-8-8-8zm-3 9c-.83 0-1.5-.67-1.5-1.5S8.17 8 9 8s1.5.67 1.5 1.5S9.83 11 9 11zm6 0c-.83 0-1.5-.67-1.5-1.5S14.17 8 15 8s1.5.67 1.5 1.5S15.83 11 15 11zm-5.5 5h5v1h-5v-1z"/>
            </svg>
        </div>

        <h1>SkullHub</h1>
        <div class="subtitle">Your Premium Key Access</div>

        <div class="key-container">
            <div class="key-text" id="keyText">SkullHubEvomonRobloxGameHack</div>
        </div>

        <button class="btn" onclick="copyKey()">Copy Key</button>

        <div class="footer-text">© 2026 SkullHub. Secured Cyber Access.</div>
    </div>

    <div class="toast" id="toast">KEY COPIED TO CLIPBOARD!</div>

    <script>
        function copyKey() {
            const keyText = document.getElementById("keyText").innerText;
            const toast = document.getElementById("toast");

            navigator.clipboard.writeText(keyText).then(() => {
                toast.classList.add("show");
                setTimeout(() => {
                    toast.classList.remove("show");
                }, 2500);
            }).catch(err => {
                alert("Lỗi sao chép Key: " + err);
            });
        }
    </script>
</body>
</html>
