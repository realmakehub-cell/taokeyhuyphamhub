<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RingTaScripts Hub | Key System</title>
    <!-- Google Font & Font Awesome Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        :root {
            --bg-color: #0b0d13;
            --card-bg: rgba(22, 27, 38, 0.65);
            --accent-color: #00f2fe;
            --accent-gradient: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            --text-main: #ffffff;
            --text-muted: #8a99ad;
            --border-glow: rgba(0, 242, 254, 0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 15% 20%, rgba(0, 198, 255, 0.12) 0%, transparent 40%),
                radial-gradient(circle at 85% 80%, rgba(0, 114, 255, 0.12) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow: hidden;
        }

        /* Card Container with Glassmorphism */
        .card {
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-glow);
            border-radius: 20px;
            padding: 40px 30px;
            width: 100%;
            max-width: 440px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6),
                        0 0 30px rgba(0, 242, 254, 0.08);
            position: relative;
            transition: transform 0.3s ease;
        }

        .card:hover {
            transform: translateY(-4px);
        }

        /* Badge Status */
        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            background: rgba(0, 242, 254, 0.1);
            border: 1px solid rgba(0, 242, 254, 0.2);
            color: var(--accent-color);
            padding: 6px 14px;
            border-radius: 30px;
            font-size: 0.75rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            margin-bottom: 20px;
        }

        .status-dot {
            width: 6px;
            height: 6px;
            background-color: var(--accent-color);
            border-radius: 50%;
            box-shadow: 0 0 8px var(--accent-color);
        }

        /* Typography */
        h1 {
            font-size: 1.75rem;
            font-weight: 800;
            color: var(--text-main);
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        p.subtitle {
            color: var(--text-muted);
            font-size: 0.9rem;
            margin-bottom: 28px;
        }

        /* Input Wrapper */
        .input-group {
            position: relative;
            margin-bottom: 20px;
        }

        .key-input {
            width: 100%;
            background: rgba(10, 13, 20, 0.8);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            padding: 16px 45px 16px 16px;
            color: var(--accent-color);
            font-size: 0.95rem;
            font-weight: 600;
            text-align: left;
            outline: none;
            transition: all 0.3s ease;
        }

        .key-input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 15px rgba(0, 242, 254, 0.2);
        }

        .input-icon {
            position: absolute;
            right: 16px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
            font-size: 1rem;
        }

        /* Primary Button */
        .btn-copy {
            width: 100%;
            background: var(--accent-gradient);
            color: #ffffff;
            border: none;
            padding: 16px;
            border-radius: 12px;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            box-shadow: 0 8px 25px rgba(0, 114, 255, 0.35);
            transition: all 0.3s ease;
        }

        .btn-copy:hover {
            opacity: 0.95;
            box-shadow: 0 12px 30px rgba(0, 198, 255, 0.5);
            transform: translateY(-1px);
        }

        .btn-copy:active {
            transform: scale(0.98);
        }

        /* Toast Alert */
        .toast {
            position: fixed;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(16, 185, 129, 0.9);
            color: white;
            padding: 12px 24px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 8px;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(8px);
            transition: all 0.4s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            opacity: 0;
        }

        .toast.show {
            bottom: 30px;
            opacity: 1;
        }
    </style>
</head>
<body>

    <div class="card">
        <div class="status-badge">
            <span class="status-dot"></span>
            SYSTEM ONLINE
        </div>
        
        <h1>RingTaScripts Hub</h1>
        <p class="subtitle">Nhấp bên dưới để sao chép key xác thực</p>

        <div class="input-group">
            <input type="text" id="keyInput" class="key-input" value="RingTaScripsForsakenHubRobloxHack" readonly>
            <i class="fa-solid fa-key input-icon"></i>
        </div>

        <button class="btn-copy" onclick="copyKey()">
            <i class="fa-regular fa-copy"></i>
            <span id="btnText">Sao Chép Key</span>
        </button>
    </div>

    <!-- Thông báo nổi khi sao chép -->
    <div id="toast" class="toast">
        <i class="fa-solid fa-circle-check"></i>
        <span>Đã sao chép key thành công!</span>
    </div>

    <script>
        function copyKey() {
            const keyInput = document.getElementById("keyInput");
            const btnText = document.getElementById("btnText");
            const toast = document.getElementById("toast");

            // Sao chép nội dung
            navigator.clipboard.writeText(keyInput.value).then(() => {
                // Đổi chữ trên nút tạm thời
                btnText.innerText = "Đã Chép!";
                
                // Hiển thị Toast
                toast.classList.add("show");

                setTimeout(() => {
                    btnText.innerText = "Sao Chép Key";
                    toast.classList.remove("show");
                }, 2500);
            });
        }
    </script>

</body>
</html>
