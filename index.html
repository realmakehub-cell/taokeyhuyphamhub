<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Huy Pham Hub - Key</title>
<style>
:root{
  --ink:#0a0b0d;--panel:#111317;--raise:#171a1f;--line:#2a2f37;--line-hi:#4a525e;
  --text:#f2f4f7;--muted:#98a1ad;--ok:#7ee2a3;--bad:#ff7a7a;--warn:#f0c674;
  --mono:ui-monospace,"Cascadia Mono","SF Mono",Consolas,monospace;
  --sans:"Segoe UI",system-ui,-apple-system,Roboto,Arial,sans-serif;
}
*{box-sizing:border-box}
html{color-scheme:dark}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px 16px;background:var(--ink);color:var(--text);font:15px/1.5 var(--sans)}
.wrap{width:min(100%,520px)}
.brand{margin:0 0 18px 4px;font-size:14px;font-weight:700;letter-spacing:.14em}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:28px}
.tabs{display:flex;gap:4px;margin:0 0 24px;padding:4px;border:1px solid var(--line);border-radius:12px;background:var(--ink)}
.tabs a{flex:1;display:flex;align-items:center;justify-content:center;min-height:40px;border-radius:8px;color:var(--muted);font-weight:600;font-size:14px;text-decoration:none}
.tabs a:hover{color:var(--text)}
.tabs a[aria-current=page]{background:var(--text);color:var(--ink)}
h1{margin:0 0 4px;font-size:22px;font-weight:650;line-height:1.25}
.sub{margin:0 0 20px;color:var(--muted);font-size:13.5px}
ol{margin:0 0 20px;padding-left:20px}
li{margin:0 0 8px;padding-left:4px}
li::marker{color:var(--muted)}
label{display:block;margin:0 0 8px;font-size:13px;color:var(--muted)}
.gap{margin-top:16px}
input,select{width:100%;min-width:0;padding:14px;border-radius:10px;border:1px solid var(--line-hi);background:var(--ink);color:var(--text);font:15px var(--sans)}
.keyin{font:600 16px var(--mono);letter-spacing:.04em;text-transform:uppercase}
.keyin::placeholder{color:#59616d;text-transform:none;letter-spacing:0;font-weight:400}
.field{display:flex;gap:8px}
.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}
button,.btn{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 16px;border-radius:10px;border:1px solid var(--line-hi);background:var(--raise);color:var(--text);font:600 14px var(--sans);cursor:pointer;text-decoration:none}
